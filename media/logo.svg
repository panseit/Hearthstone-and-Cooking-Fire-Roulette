<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6a36"/><stop offset="0.45" stop-color="#4a3718"/><stop offset="1" stop-color="#1c140a"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a66"/><stop offset="0.45" stop-color="#0d1a2c"/><stop offset="0.55" stop-color="#2a0f06"/><stop offset="1" stop-color="#6e2a0c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe39a"/><stop offset="0.5" stop-color="#d49b2e"/><stop offset="1" stop-color="#7a4f12"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0331f"/><stop offset="1" stop-color="#7c140c"/>
