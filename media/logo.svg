-width="2.2"/><path d="M91.55,193.88 A178,178 0 0 1 130.13,136.13 L162.66,168.66 A132,132 0 0 0 134.05,211.49 Z" fill="url(#black)" stroke="#e2b54c" stroke-width="2.2"/><path d="M130.13,136.13 A178,178 0 0 1 187.88,97.55 L205.49,140.05 A132,132 0 0 0 162.66,168.66 Z" fill="url(#red)" stroke="#e2b54c" stroke-width="2.2"/><path d="M187.88,97.55 A178,178 0 0 1 256.00,84.00 L256.00,130.00 A132,132 0 0 0 205.49,140.05 Z" fill="url(#black)" stroke="#e2b54c" stroke-width="2.2"/>
