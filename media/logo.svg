    <linearGradient id="flameCore" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff3b0"/><stop offset="1" stop-color="#fffbe6"/>
    </linearGradient>
    <linearGradient id="log" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5429"/><stop offset="1" stop-color="#3e2210"/>
